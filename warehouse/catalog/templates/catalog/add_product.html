{% extends 'base.html' %}

{% block title %}Додати нову гру{% endblock %}

{% block content %}
<h2>Додати нову настільну гру</h2>

<form method="post" action="{% url 'add_product' %}">
    {% csrf_token %}
    <div>
        <label>Назва гри:</label><br>
        <input type="text" name="name" required>
    </div><br>
    <div>
        <label>Мін. гравців:</label><br>
        <input type="number" name="min_players" value="2" required>
    </div><br>
    <div>
        <label>Макс. гравців:</label><br>
        <input type="number" name="max_players" value="4" required>
    </div><br>
    <div>
        <label>Жанр:</label><br>
        <input type="text" name="genre" required>
    </div><br>
    <div>
        <label>Ціна (грн):</label><br>
        <input type="number" step="0.01" name="price" required>
    </div><br>
    <button type="submit">Зберегти гру</button>
</form>
{% endblock %}
